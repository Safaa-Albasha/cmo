<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وعد الخصوصية / Privacy promise — __TITLE__</title>
<style>
:root { --bg: #f6f7f9; --surface: #ffffff; --text: #17202a; --muted: #5d6b7a; --border: #dde2e8; --accent: #1e8e4e; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f141a; --surface: #171e26; --text: #e6ebf0; --muted: #9aa8b6; --border: #2c3846; --accent: #4cc27f; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 40px; }
header { text-align: center; margin-bottom: 20px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0; unicode-bidi: plaintext; }
.badge { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--accent); color: var(--accent); font-weight: 700; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.col { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
.col[dir="ltr"] { text-align: left; }
h2 { font-size: 1.05rem; margin: 14px 0 6px; color: var(--accent); }
section:first-child h2 { margin-top: 0; }
ul { margin: 0; padding-inline-start: 20px; }
li { margin: 3px 0; }
footer { margin-top: 18px; text-align: center; color: var(--muted); font-size: .85rem; }
@media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }
@media print { body { background: #fff; color: #000; } .col { border-color: #bbb; } main { padding: 0; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>وعد الخصوصية · Privacy promise</h1>
    <p class="sub">__TITLE__</p>
    <span class="badge">لا تُعرض أي مجموعة أقل من __MIN_AR__ · No group under __MIN__ people is ever shown</span>
  </header>
  <div class="cols">
    <div class="col" dir="rtl" lang="ar">__AR__</div>
    <div class="col" dir="ltr" lang="en">__EN__</div>
  </div>
  <footer>هذه الورقة مولّدة من إعدادات البرنامج والقواعد التي ينفّذها النظام · Generated from the programme settings and the rules the system enforces</footer>
</main>
</body>
</html>
